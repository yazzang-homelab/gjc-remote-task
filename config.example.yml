# ~/.gjc/agent/remote-task/config.yml (원점 = remote_task를 부르는 메인 호스트)
# 비밀은 여기 두지 않는다. 등록 토큰·ssh 키는 deploy/stage-worker.sh가 같은 폴더에 만든다.

# 원점 이름. 작업 호스트의 authorized_keys(command= --origin)와 등록 토큰 파일 이름에 쓰인다.
# 기본값은 이 호스트 이름(첫 마디, 소문자). 규칙: [a-z][a-z0-9-]{0,31}
origin: main

targets:
  # 신뢰 작업 호스트(SSH). deploy/stage-worker.sh로 설치한다.
  build1:
    kind: ssh
    host: build1.example.net   # 링크로컬도 된다: fe80::1%eth0
    user: gjcrt-ctl
    port: 22
    maxSlots: 2                # 이 원점이 동시에 쓸 슬롯 수(실제 상한은 작업 호스트 profile의 max_slots)
    loadMax: 0.7               # 참고값. 실제 거절은 작업 호스트 rt-helper가 한다(load1/코어)

  # 공개 작업용 박스(선택). 신뢰하지 않는 일회용 클라우드 VM이다: 공개 저장소만 보내고 키는 보내지 않는다.
  # 박스 풀 원장이 이 호스트 상태 DB에 있으므로 박스는 원점 한 곳에만 설정한다.
  # VM과 말하는 방법은 driver가 정한다(worker/box/drivers/README.md).
  #
  # driver: ssh — SSH로 닿는 아무 클라우드 VM(EC2·GCE·Hetzner·DigitalOcean 등).
  #   VM: x86_64 systemd 리눅스, 접속 계정의 비밀번호 없는 sudo, python3·git·curl·tar.
  #   원점의 ~/.ssh/known_hosts에 VM 호스트 키를 미리 넣어 둔다(pump는 BatchMode로 접속한다).
  # pub1:
  #   kind: box
  #   driver: ssh
  #   host: 203.0.113.10
  #   user: debian
  #   identityFile: ~/.ssh/rt-box
  #   maxSlots: 1
  #
  # driver: instabox — instabox.sh microVM. instabox CLI와 instabox-q 대기줄 도구가 있어야 한다.
  # pub2:
  #   kind: box
  #   driver: instabox
  #   alias: my-box            # instabox-q 별칭
  #   machine: my-box-machine  # instabox 머신 이름
  #   maxSlots: 1

# 박스 pump가 모델 요청을 대신 보낼 허브와 키 파일(root 0600). 박스로는 키가 가지 않는다.
box:
  hubBase: https://hub.example.com/v1
  keyFile: /root/.gjc/agent/remote-task/keys/gjc-rt.key

# 작업 호스트로 올릴 gjc 실행 파일(작업 호스트와 같은 아키텍처). gjcVersion을 비우면 `gjc --version`으로 읽는다.
gjcBinary: ~/.local/bin/gjc
# gjcVersion: 0.22.0

# remote_task start에서 model을 생략했을 때 쓰는 모델. 아래 허용 목록 안에 있어야 한다.
defaultModel: my-hub/my-model:high
rtKey:
  # 작업 호스트 전용 허브 키로 쓸 수 있는 모델(<provider>/<model>). 박스 템플릿도 여기서 뽑는다.
  allowedModels:
    - my-hub/my-model

# plan의 로컬 부하 추천 기준(load1/코어, 남은 메모리 비율)
thresholds:
  recommendLoad: 0.8
  recommendMemFree: 0.2
retentionDays: 7
sshConnectTimeoutS: 10
